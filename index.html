<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote Job Finder</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><h1>Remote Job Finder</h1><p>Search and filter remote jobs.</p></header>
<main>
  <div class="controls">
    <input id="search" type="search" placeholder="Search title, company or location">
    <select id="category"><option value="all">All categories</option></select>
    <select id="sort">
      <option value="date">Newest first</option>
      <option value="title">Title A-Z</option>
      <option value="company">Company A-Z</option>
    </select>
  </div>
  <p id="status" role="status"></p>
  <section id="jobs"></section>
</main>
<footer>Job data from <a href="https://remotive.com">Remotive</a>, delayed by 24 hours. Every listing links back to its Remotive page.</footer>
<script src="app.js"></script>
</body>
</html>
