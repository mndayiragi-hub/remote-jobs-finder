location = /jobs {
    return 301 /jobs/;
}

location /jobs/ {
    alias /var/www/remote-jobs-finder/;
    index index.html;
}

location = /api/jobs {
    set $args "";
    proxy_pass https://remotive.com/api/remote-jobs;
    proxy_ssl_server_name on;
    proxy_set_header Host remotive.com;
    proxy_set_header User-Agent "remote-job-finder student app";
    proxy_cache jobs;
    proxy_cache_key "jobs";
    proxy_cache_valid 200 30m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_connect_timeout 10s;
    proxy_read_timeout 15s;
}
